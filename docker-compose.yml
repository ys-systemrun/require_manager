services:
  db:
    image: postgres:16-alpine
    container_name: reqmgr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reqmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reqmgr_pass}
      POSTGRES_DB: ${POSTGRES_DB:-reqmgr}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reqmgr} -d ${POSTGRES_DB:-reqmgr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reqmgr-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-reqmgr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-reqmgr_pass}
      DB_NAME: ${POSTGRES_DB:-reqmgr}
      DB_SSLMODE: disable
      SERVER_PORT: 8080
      GIN_MODE: ${GIN_MODE:-debug}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reqmgr-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
